  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;

    :root {

      --deep-navy: #0d0a68;
      --light-blue: #ECEBFF;
      --cream-bg: #FAF8F2;
      --card-white: #FFFFFF;
      --text-main: #191f28;
      --text-sub: #6b7684;
      --border-color: rgba(27, 22, 200, 0.08);
    }

    /* 최상단 어닝 스트라이프 바 */
    .awning-stripe {

      height: 12px;
      background: repeating-linear-gradient(

        var(--primary-blue),
        var(--primary-blue) 12px,

        #ffffff 24px

      flex-direction: column;
      text-decoration: none;

      font-weight: 900;
      color: var(--primary-blue);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

      padding: 0 12px;
      border-top: 1px solid rgba(0,0,0,0.04);
    }
    .tab-btn {

      text-align: center;
      padding: 10px 4px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #717680;
      text-decoration: none;
      position: relative;
      letter-spacing: -0.3px;
      transition: color 0.2s;
    }
    .tab-btn.active {
      color: var(--primary-blue);
      font-weight: 800;
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2.5px;
      background: var(--primary-blue);
      border-radius: 2px;

      line-height: 1.4;

      bottom: -1px;

      width: 100%;

    }

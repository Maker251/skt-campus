<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SK텔레콤 찾아가는 캠퍼스 × 전남대학교</title>

  <!-- 카카오톡 / SNS 공유 오픈그래프(OG) 메타 태그 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SK텔레콤 찾아가는 캠퍼스 × 전남대학교" />
  <meta property="og:description" content="코칭 클래스부터 무료 커피차, 단말 케어까지! 전남대학교에서 함께합니다." />
  <meta property="og:url" content="https://maker251.github.io/skt-campus/" />
  <meta property="og:image" content="https://maker251.github.io/skt-campus/thumbnail.png?v=6" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FAF8F2;
      color: #191f28;
      line-height: 1.5;
      word-break: keep-all;
      padding-bottom: 0;
    }
    a { text-decoration: none; color: inherit; }

    :root {
      --primary-blue: #1b16c8;
      --deep-navy: #0d0a68;
      --light-blue: #ECEBFF;
      --cream-bg: #FAF8F2;
      --card-white: #FFFFFF;
      --text-main: #191f28;
      --text-sub: #6b7684;
      --border-color: rgba(27, 22, 200, 0.08);
    }

    /* 최상단 어닝 스트라이프 바 */
    .awning-stripe {
      width: 100%;
      height: 12px;
      background: repeating-linear-gradient(
        -45deg,
        var(--primary-blue),
        var(--primary-blue) 12px,
        #ffffff 12px,
        #ffffff 24px
      );
    }

    /* 담백한 언더라인 헤더 (GNB) */
    .mobile-header-final {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(250, 248, 242, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    .header-logo-row {
      padding: 14px 20px 8px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .brand-logo {
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }
    .brand-logo .brand-top {
      font-size: 0.76rem;
      font-weight: 800;
      color: var(--primary-blue);
      line-height: 1.1;
      letter-spacing: -0.2px;
    }
    .brand-logo .brand-bottom {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--primary-blue);
      letter-spacing: -0.5px;
      line-height: 1.2;
    }
    .tab-nav {
      display: flex;
      padding: 0 12px;
      border-top: 1px solid rgba(0,0,0,0.04);
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 10px 4px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #717680;
      text-decoration: none;
      position: relative;
      letter-spacing: -0.3px;
      transition: color 0.2s;
    }
    .tab-btn.active {
      color: var(--primary-blue);
      font-weight: 800;
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2.5px;
      background: var(--primary-blue);
      border-radius: 2px;
    }

    /* 모바일 히어로 (About) */
    .mobile-hero {
      background: var(--primary-blue);
      color: #ffffff;
      padding: 40px 20px 52px;
      text-align: center;
      position: relative;
      scroll-margin-top: 90px;
    }
    .hero-period {
      display: inline-block;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .hero-box {
      background: #ffffff;
      color: var(--primary-blue);
      border-radius: 22px;
      padding: 20px 18px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
      margin-bottom: 18px;
      display: inline-block;
      width: 100%;
      max-width: 340px;
    }
    .hero-box h1 {
      letter-spacing: -1px;
      line-height: 1.25;
      margin: 0;
    }
    .hero-box-small {
      display: block;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-blue);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .hero-box-main {
      display: block;
      font-size: 1.95rem;
      font-weight: 900;
      color: var(--primary-blue);
      letter-spacing: -1px;
    }
    .hero-sub {
      font-size: 1.15rem;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 0;
    }
    .hero-curve {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 28px;
      background: var(--cream-bg);
      border-radius: 28px 28px 0 0;
    }

    /* 본문 컨테이너 */
    .container {
      padding: 24px 18px 40px;
    }

    /* 섹션 스크롤 마진 */
    .scroll-target {
      scroll-margin-top: 96px;
    }

    /* 섹션 헤더 */
    .sec-header {
      margin-bottom: 16px;
    }
    .sec-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--primary-blue);
      letter-spacing: 1.5px;
      display: block;
      margin-bottom: 4px;
    }
    .sec-title {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--deep-navy);
      letter-spacing: -0.5px;
      line-height: 1.3;
    }
    .sec-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 전남대 상세 일정 카드 */
    .cnu-schedule-card {
      background: var(--card-white);
      border: 2px solid var(--primary-blue);
      border-radius: 20px;
      padding: 22px 18px;
      margin-bottom: 44px;
      box-shadow: 0 8px 24px rgba(27, 22, 200, 0.08);
    }
    .cnu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f5;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .cnu-title-area h3 {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--deep-navy);
    }
    .cnu-title-area p {
      font-size: 0.8rem;
      color: var(--text-sub);
    }
    .cnu-info-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cnu-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
    }
    .cnu-label {
      flex: 0 0 64px;
      font-weight: 800;
      color: var(--primary-blue);
      background: var(--light-blue);
      padding: 3px 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.75rem;
    }
    .cnu-val {
      flex: 1;
      color: #333d4b;
      font-weight: 600;
      line-height: 1.45;
    }
    .cnu-val strong {
      color: var(--text-main);
      font-weight: 800;
    }

    /* PROGRAM 01: 코칭 클래스 카드 */
    .coaching-card {
      background: var(--card-white);
      border-radius: 22px;
      padding: 22px 18px;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 6px 20px rgba(27, 22, 200, 0.05);
      margin-bottom: 44px;
    }
    .coaching-badge {
      font-size: 0.72rem;
      font-weight: 800;
      background: var(--light-blue);
      color: var(--primary-blue);
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 10px;
    }
    .coaching-main-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--deep-navy);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .coaching-lead-text {
      font-size: 0.88rem;
      color: var(--text-sub);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* 강사 1인 프로필 */
    .speakers-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }
    .speaker-card {
      background: #FAF9FF;
      border: 1px solid rgba(27, 22, 200, 0.12);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .speaker-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--primary-blue);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      flex-shrink: 0;
      overflow: hidden;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: relative;
    }
    .speaker-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }
    .speaker-info h4 {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .speaker-info h4 span {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary-blue);
    }
    .speaker-info p {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 2px;
      line-height: 1.4;
    }

    /* 타임테이블 */
    .timetable-box {
      background: #FFFFFF;
      border: 1px solid #ECECF2;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .timetable-header {
      background: #F4F5F9;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #4e5968;
      border-bottom: 1px solid #ECECF2;
    }
    .timetable-row {
      display: flex;
      padding: 12px 14px;
      border-bottom: 1px solid #F0F0F5;
      font-size: 0.85rem;
      align-items: flex-start;
      gap: 10px;
    }
    .timetable-row:last-child {
      border-bottom: none;
    }
    .tt-time {
      flex: 0 0 88px;
      font-weight: 800;
      color: var(--primary-blue);
      font-size: 0.8rem;
    }
    .tt-desc {
      flex: 1;
      color: #333d4b;
    }
    .tt-desc strong {
      display: block;
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.88rem;
      margin-bottom: 2px;
    }
    .tt-desc span {
      font-size: 0.78rem;
      color: #6b7684;
      line-height: 1.35;
      display: block;
    }
    .tt-speaker {
      display: inline-block;
      font-size: 0.88rem;
      font-weight: 800;
      color: #191f28;
      margin-top: 2px;
      margin-bottom: 1px;
    }

    /* 웰컴 기프트 배너 */
    .gift-box-wrap {
      background: #FAF9FF;
      border: 1px dashed rgba(27, 22, 200, 0.25);
      border-radius: 14px;
      padding: 16px 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .gift-box-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--deep-navy);
      margin-bottom: 12px;
    }
    .gift-box-title span {
      color: var(--primary-blue);
    }
    .gift-box-items {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .gift-pill {
      background: #ffffff;
      border: 1px solid #ECECF2;
      border-radius: 10px;
      padding: 8px 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .gift-pill .pill-tag {
      font-size: 0.65rem;
      background: var(--primary-blue);
      color: #ffffff;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .gift-pill .gift-text {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      line-height: 1.25;
    }

    /* 코칭 클래스 내부 사전 참석 예약 버튼 */
    .reserve-btn {
      display: block;
      width: 100%;
      background: var(--primary-blue);
      color: #ffffff;
      text-align: center;
      padding: 15px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(27, 22, 200, 0.22);
      transition: opacity 0.2s;
    }
    .reserve-btn:hover {
      opacity: 0.95;
    }

    /* PROGRAM 02: 캠퍼스 존 (2X2 정사각형 그리드) */
    .zone-2x2-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 44px;
    }
    .zone-square-card {
      width: calc(50% - 6px);
      background: var(--card-white);
      border-radius: 20px;
      padding: 16px 10px;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(27, 22, 200, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
      height: 165px;
      box-sizing: border-box;
    }
    .zone-icon-circle {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #FAF8F2;
      border: 1.5px solid rgba(27, 22, 200, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    .zone-title {
      font-size: 0.98rem;
      font-weight: 900;
      color: var(--deep-navy);
      margin-bottom: 4px;
      line-height: 1.25;
    }
    .zone-sub {
      font-size: 0.74rem;
      color: var(--text-sub);
      line-height: 1.35;
    }
    .zone-chip {
      margin-top: 8px;
      font-size: 0.68rem;
      font-weight: 800;
      background: var(--light-blue);
      color: var(--primary-blue);
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* 순회 일정 (가로 슬라이드 형태) */
    .tour-scroll-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px;
    }
    .scroll-hint {
      font-size: 0.75rem;
      color: var(--primary-blue);
      font-weight: 700;
    }
    .tour-horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin-bottom: 30px;
    }
    .tour-horizontal-scroll::-webkit-scrollbar {
      display: none;
    }
    .tour-snap-card {
      flex: 0 0 170px;
      background: var(--card-white);
      border-radius: 18px;
      padding: 16px 14px;
      border: 1.5px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(27, 22, 200, 0.04);
      scroll-snap-align: start;
    }
    .tour-snap-card.active {
      border-color: var(--primary-blue);
      background: #FAF9FF;
      box-shadow: 0 6px 18px rgba(27, 22, 200, 0.09);
    }
    .snap-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--deep-navy);
      margin-bottom: 4px;
    }
    .snap-date {
      font-size: 0.78rem;
      color: var(--text-sub);
    }
    .snap-badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      background: #EEF2FF;
      color: var(--primary-blue);
      width: fit-content;
    }

    /* 푸터 */
    footer {
      background: var(--deep-navy);
      color: rgba(255, 255, 255, 0.65);
      padding: 36px 18px 30px;
      text-align: center;
      font-size: 0.78rem;
    }
    .footer-brand {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <!-- 최상단 스트라이프 -->
  <div class="awning-stripe"></div>

  <!-- 담백한 언더라인 헤더 (GNB) -->
  <header class="mobile-header-final">
    <div class="header-logo-row">
      <a href="#" class="brand-logo">
        <span class="brand-top">SK telecom</span>
        <span class="brand-bottom">찾아가는 캠퍼스</span>
      </a>
    </div>
    <nav class="tab-nav">
      <a href="#section-about" class="tab-btn active" data-target="section-about">About</a>
      <a href="#section-coaching" class="tab-btn" data-target="section-coaching">코칭 클래스</a>
      <a href="#section-zone" class="tab-btn" data-target="section-zone">캠퍼스 존</a>
      <a href="#section-tour" class="tab-btn" data-target="section-tour">순회 일정</a>
    </nav>
  </header>

  <!-- HERO SECTION (About) -->
  <section class="mobile-hero scroll-target" id="section-about">
    <div class="hero-period">2026. 10. 28(수) 전남대학교</div>
    <br />
    <div class="hero-box">
      <h1>
        <span class="hero-box-small">SK텔레콤</span>
        <span class="hero-box-main">찾아가는 캠퍼스</span>
      </h1>
    </div>
    <div class="hero-sub">코칭 클래스부터 특별한 캠퍼스 경험까지<br />전남대학교에서 함께합니다!</div>
    <div class="hero-curve"></div>
  </section>
